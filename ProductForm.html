<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Product Master Registration</title>
  <style>
    :root {
      --primary-color: #1e293b;
      --accent-color: #10b981;
      --bg-color: #f1f5f9;
      --border-color: #cbd5e1;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #334155;
    }
    .form-container {
      background: #ffffff;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      color: var(--primary-color);
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 13px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      text-transform: uppercase; 
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    textarea {
      resize: vertical;
      height: 70px;
    }
    .mobile-fields {
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border: 1px dashed #cbd5e1;
      margin-bottom: 15px;
      display: none;
    }
    .row-fields {
      display: flex;
      gap: 10px;
    }
    .btn-submit {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #059669;
    }
    #statusMsg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
      display: none;
    }
    .success { background-color: #d1fae5; color: #065f46; }
    .error { background-color: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>📦 Product Master Registration</h2>[cite: 5]
    <form id="productForm" onsubmit="handleFormSubmit(event)">
      
      <div class="form-group">
        <label for="product_category">Product Category</label>[cite: 5]
        <input type="text" id="product_category" name="product_category" list="catList" placeholder="e.g. Mobile, Ref, LED" required oninput="checkCategory(this.value)" onkeydown="handleEnter(event, 'company_name')">[cite: 5]
        <datalist id="catList"></datalist>[cite: 5]
      </div>

      <div class="form-group">
        <label for="company_name">Company Name / Brand</label>[cite: 5]
        <input type="text" id="company_name" name="company_name" list="companyList" placeholder="e.g. Samsung, Apple, Dawlance" required onkeydown="handleEnter(event, 'model')">[cite: 5]
        <datalist id="companyList"></datalist>[cite: 5]
      </div>

      <div class="form-group">
        <label for="model">Model</label>[cite: 5]
        <input type="text" id="model" name="model" list="modelList" placeholder="e.g. Galaxy S23, 9170 WB LVS" required onkeydown="handleModelEnter(event)">[cite: 5]
        <datalist id="modelList"></datalist>[cite: 5]
      </div>

      <!-- Color field -->
      <div class="form-group">
        <label for="color">Color</label>[cite: 5]
        <input type="text" id="color" name="color" list="colorList" placeholder="e.g. Black, Blue, Silver" onkeydown="handleColorEnter(event)">[cite: 5]
        <datalist id="colorList"></datalist>[cite: 5]
      </div>

      <!-- Dynamic Mobile Extra Fields (RAM & ROM) -->
      <div id="mobileExtraSection" class="mobile-fields">
        <label style="color: #0d9488; margin-bottom: 8px;">📱 Mobile Specifications</label>[cite: 5]
        <div class="row-fields">
          <div style="flex: 1;">
            <label for="ram">RAM</label>[cite: 5]
            <input type="text" id="ram" name="ram" list="ramList" placeholder="e.g. 8GB, 12GB" onkeydown="handleEnter(event, 'memory')">[cite: 5]
            <datalist id="ramList"></datalist>[cite: 5]
          </div>
          <div style="flex: 1;">
            <label for="memory">Memory (ROM)</label>[cite: 5]
            <input type="text" id="memory" name="memory" list="romList" placeholder="e.g. 128GB, 256GB" onkeydown="handleEnter(event, 'remarks')">[cite: 5]
            <datalist id="romList"></datalist>[cite: 5]
          </div>
        </div>
      </div>

      <!-- Remarks field -->
      <div class="form-group">
        <label for="remarks">Remarks</label>[cite: 5]
        <textarea id="remarks" name="remarks" placeholder="Optional notes or specifications..."></textarea>[cite: 5]
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Save Product</button>[cite: 5]
      
      <div id="statusMsg"></div>[cite: 5]
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqIsbieX-bO0HmW9vt6GiBP2mYX8T2MLgmwpKFodIXHdk0XUXWYMphf4HvU_98Ws803Q/exec";

    window.onload = function() {
      loadDropdownSuggestions();
    };

    function loadDropdownSuggestions() {
      fetch(`${SCRIPT_URL}?action=getProductDropdownData`)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          populateDatalist('catList', data.categories);
          populateDatalist('companyList', data.companies);
          populateDatalist('modelList', data.models);
          populateDatalist('colorList', data.colors);
          populateDatalist('ramList', data.rams);
          populateDatalist('romList', data.roms);
        })
        .catch(err => {
          console.error("Error loading dropdown data:", err);
        });
    }

    function populateDatalist(listId, items) {
      var list = document.getElementById(listId);
      list.innerHTML = '';
      if (items && items.length > 0) {
        items.forEach(function(item) {
          if (item) {
            var opt = document.createElement('option');
            opt.value = item;
            list.appendChild(opt);
          }
        });
      }
    }

    function handleEnter(event, nextFieldId) {
      if (event.key === 'Enter') {
        event.preventDefault();
        var nextField = document.getElementById(nextFieldId);
        if (nextField) {
          nextField.focus();
          nextField.select();
        }
      }
    }

    function handleModelEnter(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        var mobileSection = document.getElementById('mobileExtraSection');
        var nextField;
        
        if (mobileSection.style.display === 'block') {
          nextField = document.getElementById('ram');
        } else {
          nextField = document.getElementById('color');
        }
        
        if (nextField) {
          nextField.focus();
          nextField.select();
        }
      }
    }

    function handleColorEnter(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        var mobileSection = document.getElementById('mobileExtraSection');
        var nextField;
        
        if (mobileSection.style.display === 'block') {
          nextField = document.getElementById('ram');
        } else {
          nextField = document.getElementById('remarks');
        }
        
        if (nextField) {
          nextField.focus();
          nextField.select();
        }
      }
    }

    function checkCategory(val) {
      var cat = val.trim().toLowerCase();
      var mobileSection = document.getElementById('mobileExtraSection');
      if (cat.indexOf('mobile') !== -1 || cat.indexOf('phone') !== -1 || cat.indexOf('smartphone') !== -1) {
        mobileSection.style.display = 'block';
      } else {
        mobileSection.style.display = 'none';
        document.getElementById('memory').value = '';
        document.getElementById('ram').value = '';
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      
      var btn = document.getElementById('submitBtn');
      var statusMsg = document.getElementById('statusMsg');
      
      btn.disabled = true;
      btn.innerText = "Saving...";
      statusMsg.style.display = "none";
      
      var rawMemory = document.getElementById('memory').value.trim();
      var rawRam = document.getElementById('ram').value.trim();
      
      var formattedMemory = rawMemory ? (rawMemory.toLowerCase().includes('gb') ? rawMemory : rawMemory + " GB") : "";
      var formattedRam = rawRam ? (rawRam.toLowerCase().includes('gb') ? rawRam : rawRam + " GB") : "";
      
      var formData = {
        action: "saveProductMaster",
        product_category: document.getElementById('product_category').value.trim().toUpperCase(),
        company_name: document.getElementById('company_name').value.trim().toUpperCase(),
        model: document.getElementById('model').value.trim().toUpperCase(),
        color: document.getElementById('color').value.trim().toUpperCase(),
        memory: formattedMemory.toUpperCase(),
        ram: formattedRam.toUpperCase(),
        remarks: document.getElementById('remarks').value.trim().toUpperCase()
      };
      
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(response => {
        btn.disabled = false;
        btn.innerText = "Save Product";
        statusMsg.style.display = "block";
        
        if (response && response.success) {
          statusMsg.className = "success";
          statusMsg.innerText = response.message + " (ID: " + response.product_id + ")";
          document.getElementById('productForm').reset();
          document.getElementById('mobileExtraSection').style.display = 'none';
          loadDropdownSuggestions();
        } else {
          statusMsg.className = "error";
          statusMsg.innerText = "Error: " + (response ? response.error : "Unknown error");
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = "Save Product";
        statusMsg.style.display = "block";
        statusMsg.className = "error";
        statusMsg.innerText = "Server Error: " + err.message;
      });
    }
  </script>

</body>
</html>
